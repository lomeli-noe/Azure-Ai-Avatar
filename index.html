<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select a Conference</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        .container {
            text-align: center;
        }
        .conference-button {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        .conference-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cognitive Science Conference Login</h1>
        <form id="login-form">
            <input type="email" id="email" placeholder="Enter your email" required style="padding:10px; font-size:16px; border-radius:4px; border:1px solid #ccc; width:250px;">
            <button type="submit" style="padding:10px 20px; font-size:16px; border-radius:4px; background:#007bff; color:white; border:none; margin-left:10px;">Login</button>
        </form>
        <div id="conference-section" style="display:none; margin-top:20px;">
            <a href="/chat.html?conference=agi" class="conference-button">Cognitive Science Conference</a>
        </div>
        <div id="login-message" style="color:red; margin-top:10px;"></div>
    </div>
<script>
// Simple frontend login logic (to be replaced with real backend auth)
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (data.success) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('conference-section').style.display = 'block';
        document.getElementById('login-message').textContent = '';
    } else {
        document.getElementById('login-message').textContent = data.message || 'Login failed.';
    }
});
</script>
</body>
</html>
